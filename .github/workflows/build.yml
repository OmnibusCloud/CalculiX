name: build

on:
  push:
    branches: [main]
    tags: ['ccx-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      with_pastix:
        description: 'Build PaStiX support'
        type: boolean
        default: false
      full_verify:
        description: 'Run the whole 610-deck acceptance suite instead of the smoke subset'
        type: boolean
        default: false

# A deck the smoke run must get right on every platform: one static, one
# thermal, one frequency (so ARPACK is exercised), one transient.
env:
  SMOKE_DECKS: 'beamp beamt achtel2 thermomech'

jobs:
  win-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            unzip
            perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja

      - name: Build
        env:
          CC: gcc
          FC: gfortran
          WITH_PASTIX: ${{ inputs.with_pastix && '1' || '0' }}
          # Chosen through the environment rather than -G: a generator name
          # with a space in it does not survive being passed through a shell
          # variable, which is how the first attempt failed.
          CMAKE_GENERATOR: Ninja
        run: sh build/build.sh

      - name: Verify
        env:
          # Written as "not full && subset || empty", NOT "full && empty ||
          # subset". The second reads better and is silently broken: the true
          # branch evaluates to the empty string, which is falsy, so `||` falls
          # through and the subset wins even when the whole suite was asked
          # for. A full-verification run reported success over four decks.
          VERIFY_ONLY: ${{ !inputs.full_verify && env.SMOKE_DECKS || '' }}
        run: sh build/verify.sh

      - name: Publish the result set for the cross-platform comparison
        # always(): a failing verdict must not suppress the measurement. A red
        # platform is when comparing platforms is most informative.
        if: ${{ always() && inputs.full_verify }}
        uses: actions/upload-artifact@v4
        with:
          name: results-win-x64
          path: .build/verify/ours/*.dat
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ccx-win-x64
          path: .build/out/

  linux-x64:
    # Pinned rather than latest: the glibc the binary is built against is the
    # oldest one it will run on, and compute nodes are not all current.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gfortran cmake make unzip perl

      - name: Build
        env:
          CC: gcc
          FC: gfortran
          WITH_PASTIX: ${{ inputs.with_pastix && '1' || '0' }}
        run: sh build/build.sh

      - name: Verify
        env:
          # Written as "not full && subset || empty", NOT "full && empty ||
          # subset". The second reads better and is silently broken: the true
          # branch evaluates to the empty string, which is falsy, so `||` falls
          # through and the subset wins even when the whole suite was asked
          # for. A full-verification run reported success over four decks.
          VERIFY_ONLY: ${{ !inputs.full_verify && env.SMOKE_DECKS || '' }}
        run: sh build/verify.sh

      - name: Publish the result set for the cross-platform comparison
        # always(): a failing verdict must not suppress the measurement. A red
        # platform is when comparing platforms is most informative.
        if: ${{ always() && inputs.full_verify }}
        uses: actions/upload-artifact@v4
        with:
          name: results-linux-x64
          path: .build/verify/ours/*.dat
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ccx-linux-x64
          path: .build/out/

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install gcc cmake

      # Apple's clang has no -fopenmp, and CalculiX wants it for both the C and
      # the Fortran halves. Use the Homebrew GCC for both, which is also what
      # the other two platforms use. The version is discovered rather than
      # pinned: the formula's major version moves, the binary names move with
      # it, and a hard-coded gcc-14 would break silently on a Tuesday.
      - name: Select the compilers
        run: |
          gcc_bin=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -V | tail -1)
          fc_bin=$(ls "$(brew --prefix)"/bin/gfortran-[0-9]* | sort -V | tail -1)
          echo "CC=$gcc_bin" >> "$GITHUB_ENV"
          echo "FC=$fc_bin" >> "$GITHUB_ENV"
          echo "using $gcc_bin and $fc_bin"

      - name: Build
        env:
          WITH_PARDISO: '0'
          WITH_PASTIX: ${{ inputs.with_pastix && '1' || '0' }}
        run: sh build/build.sh

      - name: Verify
        env:
          # Written as "not full && subset || empty", NOT "full && empty ||
          # subset". The second reads better and is silently broken: the true
          # branch evaluates to the empty string, which is falsy, so `||` falls
          # through and the subset wins even when the whole suite was asked
          # for. A full-verification run reported success over four decks.
          VERIFY_ONLY: ${{ !inputs.full_verify && env.SMOKE_DECKS || '' }}
        run: sh build/verify.sh

      - name: Publish the result set for the cross-platform comparison
        # always(): a failing verdict must not suppress the measurement. A red
        # platform is when comparing platforms is most informative.
        if: ${{ always() && inputs.full_verify }}
        uses: actions/upload-artifact@v4
        with:
          name: results-macos-arm64
          path: .build/verify/ours/*.dat
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ccx-macos-arm64
          path: .build/out/

  cross-platform:
    # Only run over the whole suite: four decks would say nothing about
    # agreement, and this job exists to produce a number, not a green tick.
    #
    # Windows is the reference because it is the only platform anchored twice —
    # against upstream's published results AND against the binary PrePoMax
    # ships. Anchoring the others to it puts them one link from both.
    if: ${{ always() && inputs.full_verify }}
    needs: [win-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results

      - name: Compare each platform against win-x64
        run: |
          sh build/cross-platform.sh results/results-win-x64 results/results-linux-x64 linux-x64
          sh build/cross-platform.sh results/results-win-x64 results/results-macos-arm64 macos-arm64

  release:
    if: startsWith(github.ref, 'refs/tags/ccx-v')
    needs: [win-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for d in ccx-*/; do
            name=${d%/}
            (cd "$name" && zip -qr "../$name.zip" .)
            sha256sum "$name.zip" >> SHA256SUMS
          done
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          body_path: PROVENANCE.md
