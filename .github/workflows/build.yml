name: build

on:
  push:
    branches: [main]
    tags: ['ccx-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      with_pastix:
        description: 'Build PaStiX support'
        type: boolean
        default: false
      full_verify:
        description: 'Run the whole 610-deck acceptance suite instead of the smoke subset'
        type: boolean
        default: false

# A deck the smoke run must get right on every platform: one static, one
# thermal, one frequency (so ARPACK is exercised), one transient.
env:
  SMOKE_DECKS: 'beamp beamt achtel2 thermomech'

jobs:
  win-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            unzip
            perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Build
        env:
          CC: gcc
          FC: gfortran
          WITH_PASTIX: ${{ inputs.with_pastix && '1' || '0' }}
          CMAKE_EXTRA_ARGS: -G "MinGW Makefiles"
        run: sh build/build.sh

      - name: Verify
        env:
          VERIFY_ONLY: ${{ inputs.full_verify && '' || env.SMOKE_DECKS }}
        run: sh build/verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ccx-win-x64
          path: .build/out/

  linux-x64:
    # Pinned rather than latest: the glibc the binary is built against is the
    # oldest one it will run on, and compute nodes are not all current.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gfortran cmake make unzip perl

      - name: Build
        env:
          CC: gcc
          FC: gfortran
          WITH_PASTIX: ${{ inputs.with_pastix && '1' || '0' }}
        run: sh build/build.sh

      - name: Verify
        env:
          VERIFY_ONLY: ${{ inputs.full_verify && '' || env.SMOKE_DECKS }}
        run: sh build/verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ccx-linux-x64
          path: .build/out/

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install gcc cmake

      - name: Build
        env:
          CC: clang
          FC: gfortran-14
          WITH_PARDISO: '0'
          WITH_PASTIX: ${{ inputs.with_pastix && '1' || '0' }}
        run: sh build/build.sh

      - name: Verify
        env:
          VERIFY_ONLY: ${{ inputs.full_verify && '' || env.SMOKE_DECKS }}
        run: sh build/verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ccx-macos-arm64
          path: .build/out/

  release:
    if: startsWith(github.ref, 'refs/tags/ccx-v')
    needs: [win-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for d in */; do
            name=${d%/}
            (cd "$name" && zip -qr "../$name.zip" .)
            sha256sum "$name.zip" >> SHA256SUMS
          done
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          body_path: PROVENANCE.md
